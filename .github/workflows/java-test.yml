name: Java test

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile
        run: javac Main.java AntivirusAlgoInJavaTest.java
      - name: Run focused test
        run: java AntivirusAlgoInJavaTest
